<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  由 ../export-og.sh 生成，不要手改 —— 三个语言版本的结构必须保持一致。

  这是一个「分享入口」：社交平台的爬虫不执行 JS，抓到的永远是 HTML 源码里
  那组静态 og 标签，一个 URL 只能声明一张预览图。站点的语言切换是前端做的，
  爬虫看不见 —— 所以要让不同语言的受众看到对应语言的卡片，只能让每个语言
  各有自己的 URL，这就是它们。

  跳转刻意只用 JS，不用 meta refresh：不少爬虫会跟随 meta refresh 然后改读
  目标页的 og 标签，那就前功尽弃了。爬虫不跑 JS，读完标签就停在这里；真人
  会被送到对应语言的简历。

  noindex 是因为这三个页面对搜索引擎是重复内容，真正该被收录的是 canonical
  指向的那一页。这不影响社交预览 —— 抓预览卡片的爬虫不看 robots 指令。
-->
<title>馬成軍 Michael Ma · 資深後端工程師</title>
<meta name="description" content="13 年研發經驗 · 高並發交易系統 · 分散式架構 · AI 工程化">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mikeah2011.github.io/cv/">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://mikeah2011.github.io/cv/share/zh-TW.html">
<meta property="og:site_name" content="馬成軍 Michael Ma">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="馬成軍 Michael Ma · 資深後端工程師">
<meta property="og:description" content="13 年研發經驗 · 高並發交易系統 · 分散式架構 · AI 工程化">
<meta property="og:image" content="https://mikeah2011.github.io/cv/assets/og-cover.zh-TW.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="馬成軍 Michael Ma · 資深後端工程師 · 13 年研發經驗">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b6e78'/><text x='50' y='69' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif' font-size='58' font-weight='800' fill='%23ffffff' text-anchor='middle'>M</text></svg>">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0a1315; color: #7e959c;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", sans-serif;
    font-size: 14px;
  }
  a { color: #3fbecb; }
</style>
</head>
<body>
  <p id="msg">正在前往履歷…</p>
  <p><a id="cont" href="../index.html?lang=zh-TW">如果沒有自動跳轉，請點這裡</a></p>
  <div id="shareBox" style="display:flex;gap:8px;margin-top:6px"></div>
  <script>(function(){
    var params=new URLSearchParams(location.search);var to=params.get('to');var shareUrl=location.href;var cont=document.getElementById('cont');
    function copy(text){ if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text); var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='absolute';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return Promise.resolve(); }
    var box=document.getElementById('shareBox');
    var copyBtn=document.createElement('button'); copyBtn.textContent='複製連結'; copyBtn.style.padding='8px 12px'; copyBtn.style.borderRadius='8px'; copyBtn.style.border='1px solid rgba(255,255,255,.08)'; copyBtn.style.background='transparent'; copyBtn.style.color='inherit'; copyBtn.style.cursor='pointer';
    var ld=document.createElement('button'); ld.textContent='LinkedIn'; ld.style.padding='8px 12px'; ld.style.borderRadius='8px'; ld.style.border='1px solid rgba(255,255,255,.08)'; ld.style.background='transparent'; ld.style.color='inherit'; ld.style.cursor='pointer';
    copyBtn.addEventListener('click', function(){ copy(shareUrl).then(function(){ copyBtn.textContent='已複製'; setTimeout(function(){ copyBtn.textContent='複製連結'; },1200); }); });
    ld.addEventListener('click', function(){ window.open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(shareUrl),'_blank','noopener'); });
    box.appendChild(copyBtn); box.appendChild(ld);
    var redirect=function(){ cont.href='../index.html?lang=zh-TW'+(to?'&to='+encodeURIComponent(to.slice(0,60)): ''); location.replace(cont.href); };
    setTimeout(redirect,1800);
  })()</script>
</body>
</html>
