  @media (prefers-color-scheme: dark) {

  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  .role { color: var(--accent); font-weight: 600; margin: 8px 0 28px; }
  .cards { display: grid; gap: 12px; }
  .cards a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 16px 20px; color: var(--ink); text-decoration: none;
  }
  .cards a:hover, .cards a:focus-visible { border-color: var(--accent); outline: none; }
  .cards .t { font-weight: 700; }
  .cards .d { color: var(--muted); font-size: 13px; }
  .group { margin: 24px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: var(--muted); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
