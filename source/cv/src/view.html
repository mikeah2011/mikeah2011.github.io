<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>源文件预览</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b6e78'/><text x='50' y='69' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif' font-size='58' font-weight='800' fill='%23ffffff' text-anchor='middle'>M</text></svg>">
<link rel="stylesheet" href="../assets/cv-ui.css">
<style>
  :root {
    --paper:#f5f7f7; --surface:#ffffff; --surface-2:#eceff0;
    --ink:#0e2128; --ink-2:#3a4e56; --muted:#5c6f77; --line:#dbe2e3;
    --accent:#0b6e78; --accent-dim:#0b6e7814;
    /* Proxies for the deck-preview color remap (see .slideshow-viewport
       below): must live on an ANCESTOR of .slideshow-viewport, not on it.
       Defining them on the same selector that also redeclares --accent
       etc. would make --vw-accent's own `var(--accent)` resolve against
       that selector's (about-to-be-overwritten) --accent instead of the
       real root value — an indirect cycle, same failure as a direct one. */
    --vw-bg: var(--paper); --vw-surface: var(--surface); --vw-ink: var(--ink);
    --vw-muted: var(--muted); --vw-accent: var(--accent); --vw-accent-dim: var(--accent-dim); --vw-hairline: var(--line);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0e171b; --surface:#16232a; --surface-2:#1c2c34;
      --ink:#e6eef0; --ink-2:#b2c4c9; --muted:#8aa0a8; --line:#24343b;
      --accent:#46bfc9; --accent-dim:#46bfc933;
    }
  }
  :root[data-theme="light"] {
    --paper:#f5f7f7; --surface:#ffffff; --surface-2:#eceff0;
    --ink:#0e2128; --ink-2:#3a4e56; --muted:#5c6f77; --line:#dbe2e3;
    --accent:#0b6e78; --accent-dim:#0b6e7814;
  }
  :root[data-theme="dark"] {
    --paper:#0e171b; --surface:#16232a; --surface-2:#1c2c34;
    --ink:#e6eef0; --ink-2:#b2c4c9; --muted:#8aa0a8; --line:#24343b;
    --accent:#46bfc9; --accent-dim:#46bfc933;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei",
                 "Noto Sans SC", "Noto Sans TC", sans-serif;
    transition: background-color .3s, color .3s;
  }
  .viewer-head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px clamp(16px, 4vw, 32px);
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .viewer-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 13px; flex: none;
  }
  .viewer-back:hover { color: var(--accent); }
  .viewer-back svg { width: 16px; height: 16px; }
  .viewer-fname {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; color: var(--ink-2); flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .viewer-tabs { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; flex: none; }
  .viewer-tabs button {
    border: 0; background: transparent; border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .viewer-tabs button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px #0002; }
  .viewer-raw { color: var(--muted); text-decoration: none; font-size: 13px; flex: none; white-space: nowrap; }
  .viewer-raw:hover { color: var(--accent); }
  .viewer-theme-btn {
    display: grid; place-items: center; width: 30px; height: 30px; flex: none;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
    color: var(--muted); cursor: pointer;
  }
  .viewer-theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .viewer-theme-btn svg { width: 15px; height: 15px; }
  .viewer-expand-btn {
    align-items: center; gap: 6px; height: 30px; padding: 0 12px; flex: none;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
    color: var(--muted); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600;
  }
  .viewer-expand-btn:hover { color: var(--accent); border-color: var(--accent); }
  .viewer-expand-btn svg { width: 14px; height: 14px; }
  body.preview-only .viewer-expand-btn { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px #0002; }

  .viewer-body { max-width: 1400px; margin: 0 auto; padding: clamp(18px, 4vw, 32px); }
  .pane[hidden] { display: none; }

  [data-desktop-only] { display: none; }

  /* ≥900px: show source + preview side by side so edits/structure are
     visible without tab-switching back and forth; the tab buttons that
     drive single-pane mode on phones become moot here, so they're swapped
     for one "full-page preview" toggle for the rare case a slide/table
     genuinely needs the full width to read. */
  @media (min-width: 900px) {
    [data-mobile-only] { display: none; }
    [data-desktop-only] { display: inline-flex; }
    .viewer-body { display: flex; gap: 20px; align-items: flex-start; }
    .pane[hidden] { display: block; }
    /* `height`, not just `max-height`: with only a cap, a pane shorter
       than the viewport shrinks to fit its own content instead of filling
       the available space — which left .pane-center centering a box that
       was already exactly its own height, a no-op. An explicit height
       gives centering (and the slide's own width-driven zoom) real room
       to work with. */
    #source-pane, #preview-pane { flex: 1 1 50%; min-width: 0; height: calc(100vh - 70px); overflow-y: auto; position: sticky; top: 70px; }
    body.preview-only #source-pane { display: none; }
    body.preview-only #preview-pane { flex: 1 1 100%; }
    /* Slides are shorter than the pane in both split and full-page mode,
       so they were sitting flush against the top with dead space below —
       center the whole viewport+chrome block instead. The plain markdown
       résumé preview is a document meant to be read top-down, so it opts
       out (see .pane-center gating in JS). */
    #preview-pane.pane-center { display: flex; flex-direction: column; align-items: stretch; justify-content: center; }
  }

  /* ---- source pane ---- */
  #source-pane pre {
    margin: 0; padding: 18px 20px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    overflow-x: auto; font-size: 12.5px; line-height: 1.65;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  .tok-front { color: var(--muted); font-style: italic; }
  .tok-heading { color: var(--accent); font-weight: 700; }
  .tok-hr { color: var(--muted); }
  .tok-tag { color: var(--muted); }
  .tok-bold { color: var(--ink); font-weight: 700; }
  .tok-comment { color: var(--muted); opacity: .7; }

  /* ---- plain markdown preview (résumé) ---- */
  .doc-preview { font-size: 14.5px; line-height: 1.7; }
  .doc-preview h1 { font-size: 24px; margin: 0 0 4px; }
  .doc-preview h2 { font-size: 15px; color: var(--accent); letter-spacing: .04em; margin: 28px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .doc-preview h3 { font-size: 15.5px; margin: 20px 0 2px; }
  .doc-preview p { margin: 8px 0; }
  .doc-preview ul { margin: 6px 0; padding-left: 1.2em; }
  .doc-preview li { margin: 5px 0; }
  .doc-preview li::marker { color: var(--accent); }
  .doc-preview hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .doc-preview strong { font-weight: 700; color: var(--ink); }
  .doc-preview a { color: var(--accent); }
  .doc-preview table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
  .doc-preview td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .doc-preview td:first-child { color: var(--muted); white-space: nowrap; padding-right: 18px; }

  /* ---- slide preview (marp/slidev): one slide at a time, like the real
     deck.html player, instead of a long vertical scroll of every slide. ---- */
  #slide-preview-style { display: none; }
  /* Slides render at a fixed 1280×720 canvas and get CSS-scaled to fit
     whatever width the viewport actually has (JS keeps --zoom in sync via
     ResizeObserver). Without this, a slide styled with fixed em/px sizes
     for a real 16:9 export looks correctly proportioned only by accident
     at one specific width — shrink the box (split view) and the same
     text reads too large for its slide; grow it (full-page) and the same
     text reads too small, exactly backwards from what changing the box
     size should do. Scaling the whole rendered canvas keeps every
     relative proportion correct at any size, the same trick Marp's own
     player and PowerPoint/Keynote use. */
  .slideshow-viewport {
    position: relative; width: 100%; aspect-ratio: 16/9;
    border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px #0002, 0 8px 24px -12px #0004;
  }
  .slideshow-viewport section {
    position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
    transform: scale(var(--zoom, 1)); transform-origin: top left;
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .slideshow-viewport section.active { opacity: 1; pointer-events: auto; }
  .slideshow-chrome {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-top: 14px;
  }
  .slideshow-chrome button {
    display: grid; place-items: center; width: 30px; height: 30px; flex: none;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
    color: var(--ink-2); cursor: pointer;
  }
  .slideshow-chrome button:hover { color: var(--accent); border-color: var(--accent); }
  .slideshow-chrome button svg { width: 15px; height: 15px; }
  .slideshow-dots { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .slideshow-dots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; background: var(--line); border: none; }
  .slideshow-dots button.on { background: var(--accent); }
  .slideshow-counter { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); min-width: 3.5em; text-align: center; }
</style>
</head>
<body>

<div class="viewer-head">
  <a class="viewer-back" href="../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    返回
  </a>
  <span class="viewer-fname" id="fname">—</span>
  <div class="viewer-tabs" role="tablist" data-mobile-only>
    <button type="button" data-tab="source" aria-selected="true">源码</button>
    <button type="button" data-tab="preview" aria-selected="false">预览</button>
  </div>
  <button type="button" class="viewer-expand-btn" id="expand-btn" data-desktop-only>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4"/></svg>
    <span id="expand-btn-label">整页预览</span>
  </button>
  <a class="viewer-raw" id="raw-link" href="#" target="_blank" rel="noopener">原始文件 ↗</a>
  <button type="button" class="viewer-theme-btn" id="theme-btn" aria-label="切换主题"></button>
</div>

<div class="viewer-body">
  <div class="pane" id="source-pane"><pre><code id="src-code">加载中…</code></pre></div>
  <div class="pane" id="preview-pane" hidden></div>
</div>

<script>
(function () {
  'use strict';

  var THEME_KEY = 'cv-theme';
  var THEME_ORDER = ['light', 'dark', 'system'];
  var ICONS = {
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>',
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/></svg>'
  };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var root = document.documentElement;
  var themeBtn = document.getElementById('theme-btn');
  var theme = store.get(THEME_KEY) || 'system';
  function applyTheme(mode) {
    theme = mode;
    if (mode === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    themeBtn.innerHTML = ICONS[mode] || ICONS.system;
  }
  themeBtn.addEventListener('click', function () {
    applyTheme(THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length]);
    store.set(THEME_KEY, theme);
  });
  applyTheme(theme);

  // ---- figure out which file we're viewing ----
  var qs = new URLSearchParams(location.search);
  var file = qs.get('f') || 'resume.md';
  if (!/^[\w.\-]+\.md$/.test(file)) file = 'resume.md'; // guard against weird input
  document.getElementById('fname').textContent = 'src/' + file;
  document.getElementById('raw-link').href = file;

  var kind = file.indexOf('slidev') > -1 ? 'slidev' : (file.indexOf('deck') === 0 ? 'marp' : 'plain');

  // The deck sources bake in one fixed palette each (a real Marp/Slidev file
  // can't reference this page's live theme) — map those known literals back
  // to this viewer's own theme tokens so the preview re-colors with the
  // theme toggle instead of always showing whichever palette the specific
  // file happened to ship with. Slidev sources only ever ship the dark set.
  var DECK_PALETTE = {
    dark: { bg: '#0e171b', surface: '#16232a', ink: '#e6eef0', muted: '#8aa0a8', accent: '#46bfc9', accentDim: '#46bfc933', hairline: '#24343b' },
    light: { bg: '#f5f7f7', surface: '#ffffff', ink: '#0e2128', muted: '#5c6f77', accent: '#0b6e78', accentDim: '#0b6e7814', hairline: '#dbe2e3' }
  };
  var deckTheme = file.indexOf('.light.') > -1 ? 'light' : 'dark';

  // ---- tiny inline-markdown helper (bold + links); everything here already
  // ships as <strong>/<span> HTML in the deck sources, so this only matters
  // for the plain résumé markdown. ----
  function inline(s) {
    return s
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  // ---- plain markdown -> HTML (just the subset resume.md actually uses) ----
  function renderPlainMarkdown(text) {
    var lines = text.replace(/\r\n/g, '\n').split('\n');
    var html = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (line === '---') { html.push('<hr>'); i++; continue; }
      if (line.indexOf('### ') === 0) { html.push('<h3>' + inline(line.slice(4)) + '</h3>'); i++; continue; }
      if (line.indexOf('## ') === 0) { html.push('<h2>' + inline(line.slice(3)) + '</h2>'); i++; continue; }
      if (line.indexOf('# ') === 0) { html.push('<h1>' + inline(line.slice(2)) + '</h1>'); i++; continue; }
      if (line.indexOf('|') === 0) {
        var rows = [];
        while (i < lines.length && lines[i].indexOf('|') === 0) {
          if (!/^\|[\s:-]+\|/.test(lines[i])) {
            rows.push(lines[i].split('|').slice(1, -1).map(function (c) { return c.trim(); }));
          }
          i++;
        }
        html.push('<table>' + rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</table>');
        continue;
      }
      if (line.indexOf('- ') === 0) {
        var items = [];
        while (i < lines.length && lines[i].indexOf('- ') === 0) { items.push(lines[i].slice(2)); i++; }
        html.push('<ul>' + items.map(function (it) { return '<li>' + inline(it) + '</li>'; }).join('') + '</ul>');
        continue;
      }
      html.push('<p>' + inline(line) + '</p>');
      i++;
    }
    return html.join('\n');
  }

  // ---- deck source parsing: both formats are `---`-delimited blocks that
  // this project's own generator produced, so the split points are exact
  // and known rather than guessed at with a general-purpose parser. ----
  function parseMarp(text) {
    var parts = text.replace(/\r\n/g, '\n').split('\n---\n');
    var front = parts[0] || '';
    var styleMatch = front.match(/\nstyle: \|\n([\s\S]*?)(?:\n[a-zA-Z]|$)/);
    var css = '';
    if (styleMatch) {
      css = styleMatch[1].split('\n').map(function (l) { return l.replace(/^  /, ''); }).join('\n');
    }
    var slides = parts.slice(1).map(function (s) {
      return s.replace(/<!--[\s\S]*?-->/g, '').trim();
    });
    return { css: css, slides: slides };
  }

  function parseSlidev(text) {
    var parts = text.replace(/\r\n/g, '\n').split('\n---\n');
    var slide1 = parts[1] || '';
    var styleMatch = slide1.match(/<style>([\s\S]*?)<\/style>/);
    var css = styleMatch ? styleMatch[1] : '';
    slide1 = slide1.replace(/<style>[\s\S]*?<\/style>/, '').trim();
    var slides = [slide1];
    for (var k = 3; k < parts.length; k += 2) slides.push((parts[k] || '').trim());
    return { css: css, slides: slides };
  }

  function renderSlides(css, slides, wrapperClass) {
    var styleTag = document.getElementById('slide-preview-style');
    if (!styleTag) {
      styleTag = document.createElement('style');
      styleTag.id = 'slide-preview-style';
      document.head.appendChild(styleTag);
    }
    // Re-point every literal color this specific file was authored with at
    // this viewer's own theme tokens, so the preview re-colors live with
    // the theme toggle instead of being stuck on whichever palette the
    // file happened to ship with.
    var pal = DECK_PALETTE[deckTheme];
    var VAR_MAP = {
      bg: '--vw-bg', surface: '--vw-surface', ink: '--vw-ink',
      muted: '--vw-muted', accent: '--vw-accent', accentDim: '--vw-accent-dim', hairline: '--vw-hairline'
    };
    // Longest hex literal first — `--accent-dim`'s 8-digit value starts
    // with the same 6 digits as `--accent`, so replacing the short one
    // first would corrupt it into `var(--accent)33` (invalid, and the
    // whole declaration then gets dropped).
    Object.keys(pal).sort(function (a, b) { return pal[b].length - pal[a].length; }).forEach(function (key) {
      var hex = pal[key].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      css = css.replace(new RegExp(hex, 'gi'), 'var(' + VAR_MAP[key] + ')');
    });
    // Scope the extracted deck CSS to the viewport so its bare
    // `section` / `.eyebrow` rules can't leak onto this page's own chrome.
    styleTag.textContent = css.replace(/(^|\})\s*([^{}]+)\{/g, function (m, brace, sel) {
      var scoped = sel.split(',').map(function (s) {
        s = s.trim();
        return s === ':root' ? '.slideshow-viewport' : '.slideshow-viewport ' + s;
      }).join(', ');
      return brace + ' ' + scoped + '{';
    });

    var root = document.createElement('div');
    var viewport = document.createElement('div');
    viewport.className = 'slideshow-viewport';
    slides.forEach(function (body) {
      var section = document.createElement('section');
      if (wrapperClass) section.className = wrapperClass;
      // Slide bodies are real Marp/Slidev markdown, not pre-rendered HTML —
      // marp-cli turns `# title` into <h1> at export time, but nothing here
      // does that for the live preview, so the literal "#" was leaking
      // through as plain text. Every slide has exactly one such line (its
      // title); everything else in these sources is already raw HTML.
      section.innerHTML = body.replace(/^#{1,3} (.+)$/m, function (m, text) {
        var level = m.match(/^#+/)[0].length;
        return '<h' + level + '>' + text + '</h' + level + '>';
      });
      viewport.appendChild(section);
    });
    root.appendChild(viewport);

    // Keep the fixed 1280×720 canvas scaled to whatever width the viewport
    // is actually rendered at — this is what makes the same slide read
    // correctly whether it's in the narrow split-view column or blown up
    // in full-page mode, instead of a fixed font-size looking right at
    // exactly one width and wrong everywhere else.
    // `viewport` isn't attached to the document yet at this point in
    // renderSlides() — the caller appends the returned root right after —
    // so getBoundingClientRect() here would still read a detached box (0
    // width). The caller does the first measurement synchronously right
    // after appending (see below); this observer only needs to cover
    // whatever resizes happen after that.
    if (window.ResizeObserver) {
      new ResizeObserver(function (entries) {
        var width = entries[0].contentRect.width;
        viewport.style.setProperty('--zoom', width / 1280);
      }).observe(viewport);
    }

    var sections = [].slice.call(viewport.children);
    var chrome = document.createElement('div');
    chrome.className = 'slideshow-chrome';
    var prevBtn = document.createElement('button');
    prevBtn.type = 'button'; prevBtn.setAttribute('aria-label', '上一页');
    prevBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>';
    var dotsWrap = document.createElement('div');
    dotsWrap.className = 'slideshow-dots';
    var counter = document.createElement('span');
    counter.className = 'slideshow-counter';
    var nextBtn = document.createElement('button');
    nextBtn.type = 'button'; nextBtn.setAttribute('aria-label', '下一页');
    nextBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
    chrome.appendChild(prevBtn); chrome.appendChild(dotsWrap); chrome.appendChild(counter); chrome.appendChild(nextBtn);
    root.appendChild(chrome);

    var dots = sections.map(function (_, i) {
      var d = document.createElement('button');
      d.type = 'button';
      d.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
      d.addEventListener('click', function () { go(i); });
      dotsWrap.appendChild(d);
      return d;
    });

    var cur = 0;
    function go(i) {
      cur = (i + sections.length) % sections.length;
      sections.forEach(function (s, j) { s.classList.toggle('active', j === cur); });
      dots.forEach(function (d, j) { d.classList.toggle('on', j === cur); });
      counter.textContent = (cur + 1) + ' / ' + sections.length;
    }
    prevBtn.addEventListener('click', function () { go(cur - 1); });
    nextBtn.addEventListener('click', function () { go(cur + 1); });

    // Arrow keys navigate whichever slideshow is currently on screen; only
    // one deck preview ever exists per page load, so no scoping needed.
    document.addEventListener('keydown', function (e) {
      if (root.offsetParent === null) return; // this preview isn't visible
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].indexOf(e.key) > -1) { e.preventDefault(); go(cur + 1); }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) > -1) { e.preventDefault(); go(cur - 1); }
    });

    var touchX = null;
    viewport.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
    viewport.addEventListener('touchend', function (e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 48) go(cur + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });

    go(0);
    return root;
  }

  // ---- source-pane light "highlighting" (no external tokenizer, just the
  // handful of patterns actually present in these generated files) ----
  function highlightSource(text) {
    var esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var lines = esc.split('\n');
    var inFront = false, frontDelims = 0;
    return lines.map(function (line) {
      if (line === '---') {
        frontDelims++;
        if (frontDelims <= 2 && !(kind === 'plain')) inFront = frontDelims < 2;
        return '<span class="tok-hr">---</span>';
      }
      if (inFront) return '<span class="tok-front">' + line + '</span>';
      if (/^#{1,6}[ ]/.test(line)) return '<span class="tok-heading">' + line + '</span>';
      if (/^\s*&lt;!--.*--&gt;\s*$/.test(line)) return '<span class="tok-comment">' + line + '</span>';
      return line
        .replace(/(&lt;\/?[a-zA-Z][^&]*?&gt;)/g, '<span class="tok-tag">$1</span>')
        .replace(/(\*\*.+?\*\*)/g, '<span class="tok-bold">$1</span>');
    }).join('\n');
  }

  // ---- load + render ----
  fetch(file).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (text) {
    document.getElementById('src-code').innerHTML = highlightSource(text);

    var previewPane = document.getElementById('preview-pane');
    if (kind === 'plain') {
      var doc = document.createElement('div');
      doc.className = 'doc-preview';
      doc.innerHTML = renderPlainMarkdown(text);
      previewPane.appendChild(doc);
    } else {
      var parsed = kind === 'slidev' ? parseSlidev(text) : parseMarp(text);
      previewPane.classList.add('pane-center');
      previewPane.appendChild(renderSlides(parsed.css, parsed.slides, kind === 'slidev' ? 'slidev-layout' : ''));
      var newViewport = previewPane.querySelector('.slideshow-viewport');
      newViewport.style.setProperty('--zoom', newViewport.getBoundingClientRect().width / 1280);
    }
  }).catch(function (err) {
    document.getElementById('src-code').textContent = '加载失败：' + err.message;
  });

  // ---- mobile: tab switching between single-pane source/preview ----
  var tabs = [].slice.call(document.querySelectorAll('.viewer-tabs button'));
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabs.forEach(function (b) { b.setAttribute('aria-selected', String(b === btn)); });
      document.getElementById('source-pane').hidden = btn.dataset.tab !== 'source';
      document.getElementById('preview-pane').hidden = btn.dataset.tab !== 'preview';
    });
  });

  // ---- desktop: split view is the default; this just escapes to a
  // full-width preview for slides/tables that need the room ----
  document.getElementById('expand-btn').addEventListener('click', function () {
    var on = document.body.classList.toggle('preview-only');
    document.getElementById('expand-btn-label').textContent = on ? '分栏查看' : '整页预览';
    // The ResizeObserver in renderSlides() should catch this resize on its
    // own, but it didn't fire reliably for this particular class-driven
    // aspect-ratio resize in testing — recompute directly as a fallback so
    // toggling modes doesn't leave the zoom stuck at whatever it was
    // before, which read as "the text is too small" in full-page mode.
    // getBoundingClientRect() forces the layout the class toggle just
    // triggered to actually resolve first, so this reads the real,
    // post-toggle width synchronously — no need to wait a frame for it
    // (and rAF turned out not to be reliable in every embedding context
    // anyway, so don't depend on it here).
    document.querySelectorAll('.slideshow-viewport').forEach(function (vp) {
      vp.style.setProperty('--zoom', vp.getBoundingClientRect().width / 1280);
    });
  });

  // Same fallback for plain window resizing (rotating a phone, resizing
  // the browser window) — same reasoning as the expand-btn handler above.
  window.addEventListener('resize', function () {
    document.querySelectorAll('.slideshow-viewport').forEach(function (vp) {
      vp.style.setProperty('--zoom', vp.getBoundingClientRect().width / 1280);
    });
  });
})();
</script>
</body>
</html>
