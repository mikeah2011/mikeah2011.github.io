# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Michael's Blog
subtitle: ''
description: '技术笔记 · macOS · PHP · Go · K8s · 网络'
keywords:
author: Michael
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://mikeah2011.github.io
root: /
permalink: /post/:name/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: README.md

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: false
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
#theme: landscape
#theme: obsidian
#theme: hexo-theme-aurora
theme: aurora

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:mikeah2011/mikeah2011.git
  branch: main

# SEO: sitemap / RSS / robots.txt
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

robotstxt:
  useragent: "*"
  allow:
    - /
  sitemap:
    - https://mikeah2011.github.io/sitemap.xml


# Baidu sitemap
baidusitemap:
  path: baidusitemap.xml

# 外链自动加 nofollow（保留白名单）
nofollow:
  enable: true
  field: site
  exclude:
    - mikeah2011.github.io
    - github.com/mikeah2011

# 压缩（hexo-yam: HTML/CSS/JS）
neat_enable: true
neat_html:
  enable: true
  exclude:
neat_css:
  enable: true
  exclude:
    - '*.min.css'
neat_js:
  enable: true
  mangle: true
  output:
  compress:
  exclude:
    - '*.min.js'

# 禁用 swig 标签处理（避免 GitHub Actions 语法被误识别）
swig:
  enabled: false

# hexo-renderer-marked: 禁用 Nunjucks 标签处理（避免 {{ }} 被误识别为模板）
marked:
  disableNunjucks: true
